name: overlay-apk

# Builds the Jarvis Overlay debug APK (phone/overlay). Download it from the run's
# artifacts and install it on the phone. Runs only when the overlay changes, or on demand.
on:
  push:
    paths:
      - "phone/overlay/**"
      - ".github/workflows/overlay-apk.yml"
  pull_request:
    paths:
      - "phone/overlay/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: phone/overlay
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-overlay-debug-apk
          path: phone/overlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
