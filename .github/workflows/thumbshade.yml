name: ThumbShade APK

on:
  push:
    paths:
      - "thumbshade/**"
      - ".github/workflows/thumbshade.yml"
  pull_request:
    paths:
      - "thumbshade/**"
      - ".github/workflows/thumbshade.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thumbshade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: thumbshade-apk
          path: |
            thumbshade/app/build/outputs/apk/debug/*.apk
            thumbshade/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
